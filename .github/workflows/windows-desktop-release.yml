# Fork-only distribution workflow. The upstream source is checked out by immutable SHA;
# no generated assets or source changes are pushed back to NousResearch.
name: Unofficial Windows Desktop installer

on:
  schedule:
    # GitHub cron uses UTC and can be delayed; twice a day is sufficient for tags.
    - cron: '17 1,13 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream release tag (blank = latest stable release)'
        required: false
        type: string
      build_revision:
        description: 'Candidate revision when rebuilding the same upstream tag'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: windows-desktop-release
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_tag: ${{ steps.source.outputs.source_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      should_build: ${{ steps.source.outputs.should_build }}
    steps:
      - name: Resolve upstream release and immutable commit
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          BUILD_REVISION: ${{ inputs.build_revision }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-}"
          if [[ -z "$tag" ]]; then
            tag="$(gh api repos/NousResearch/hermes-agent/releases/latest --jq '.tag_name')"
          fi
          # Keep tag names within the upstream calendar-release format; never pass
          # arbitrary user input into a shell command or Git ref expression.
          if [[ ! "$tag" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            printf 'Unsupported upstream release tag: %s\n' "$tag" >&2
            exit 1
          fi
          ref="$(gh api "repos/NousResearch/hermes-agent/git/ref/tags/$tag" --jq '.object')"
          kind="$(jq -r '.type' <<< "$ref")"
          source_sha="$(jq -r '.sha' <<< "$ref")"
          if [[ "$kind" == tag ]]; then
            source_sha="$(gh api "repos/NousResearch/hermes-agent/git/tags/$source_sha" --jq '.object.sha')"
          elif [[ "$kind" != commit ]]; then
            printf 'Unsupported Git tag object type: %s\n' "$kind" >&2
            exit 1
          fi
          if [[ ! "$source_sha" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'Upstream tag did not resolve to a commit SHA\n' >&2
            exit 1
          fi
          revision="${BUILD_REVISION:-1}"
          if [[ ! "$revision" =~ ^[1-9][0-9]*$ ]]; then
            printf 'Build revision must be a positive integer\n' >&2
            exit 1
          fi
          release_tag="windows-$tag"
          if [[ "$revision" != 1 ]]; then
            release_tag="${release_tag}-r${revision}"
          fi
          # A draft release also counts as already built. Never overwrite an
          # existing candidate or silently republish an old Windows binary.
          if gh release view "$release_tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'Already built: %s\n' "$release_tag"
            printf 'should_build=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'should_build=true\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'source_tag=%s\nsource_sha=%s\nrelease_tag=%s\n' \
            "$tag" "$source_sha" "$release_tag" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      desktop_version: ${{ steps.version.outputs.desktop_version }}
    permissions:
      contents: read
    steps:
      - name: Check out exact upstream commit, not the fork's moving branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ needs.discover.outputs.source_sha }}
          persist-credentials: false

      - name: Verify checked-out source
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.discover.outputs.source_sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:EXPECTED_SHA) { throw "Checked-out commit does not match resolved upstream release" }
          if (-not (Test-Path apps/desktop/package.json)) { throw 'Upstream tag has no Desktop app' }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm

      - name: Set up Python for reading canonical project version
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install locked workspace dependencies
        shell: pwsh
        run: npm ci

      - name: Align packaged Desktop version with upstream Agent version
        id: version
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid upstream project version' }
          $current = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($current -ne $version) {
            # npm version updates both the workspace package and root lockfile;
            # this is ephemeral packaging metadata, never pushed upstream.
            npm version $version --workspace apps/desktop --no-git-tag-version --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'Failed to align Desktop package version' }
          }
          $packaged = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          # npm lockfiles contain a valid empty-string root package key;
          # PowerShell's object-mode JSON parser rejects it.
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $locked = $lock['packages']['apps/desktop']['version']
          if ($packaged -ne $version -or $locked -ne $version) { throw 'Desktop package and lockfile versions diverge' }
          "desktop_version=$version" >> $env:GITHUB_OUTPUT

      - name: Check Desktop types and lint
        shell: pwsh
        run: |
          npm --workspace apps/desktop run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Desktop typecheck failed' }
          npm --workspace apps/desktop run lint
          if ($LASTEXITCODE -ne 0) { throw 'Desktop lint failed' }

      # The upstream all-platform Electron suite currently contains POSIX mode
      # and macOS-path assertions that fail on Windows. Keep the relevant
      # remote-startup contract, rather than skipping its failures wholesale.
      - name: Test remote first-run without local bootstrap
        shell: pwsh
        run: |
          npm --workspace apps/desktop run test -- electron/first-run-setup-main-process.test.ts electron/primary-backend-startup.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Remote first-run tests failed' }

      - name: Build Desktop and pin the upstream bootstrap source
        shell: pwsh
        working-directory: apps/desktop
        env:
          SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
          SOURCE_TAG: ${{ needs.discover.outputs.source_tag }}
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
          # npm may re-inject the workflow's fork SHA into nested lifecycle
          # scripts. Replace the generated stamp before electron-builder stages
          # extraResources, using only the discover job's immutable upstream ref.
          $stampPath = 'build/install-stamp.json'
          $stamp = Get-Content $stampPath -Raw | ConvertFrom-Json
          $stamp.commit = $env:SOURCE_SHA
          $stamp.branch = $env:SOURCE_TAG
          $stamp.dirty = $false
          $stamp.source = 'ci'
          $stamp | ConvertTo-Json -Depth 5 | Set-Content $stampPath -Encoding utf8NoBOM
          $verified = Get-Content $stampPath -Raw | ConvertFrom-Json
          if ($verified.commit -ne $env:SOURCE_SHA -or $verified.branch -ne $env:SOURCE_TAG) {
            throw 'Bootstrap stamp does not match pinned upstream source'
          }

      - name: Package precompiled Windows x64 NSIS installer
        shell: pwsh
        working-directory: apps/desktop
        run: |
          npm run builder -- --win nsis --x64
          if ($LASTEXITCODE -ne 0) { throw 'NSIS packaging failed' }

      - name: Stage installer, checksum and source provenance
        shell: pwsh
        env:
          SOURCE_TAG: ${{ needs.discover.outputs.source_tag }}
          SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
          DESKTOP_VERSION: ${{ steps.version.outputs.desktop_version }}
        run: |
          $stamp = Get-Content apps/desktop/build/install-stamp.json -Raw | ConvertFrom-Json
          if ($stamp.commit -ne $env:SOURCE_SHA) { throw 'Packaged bootstrap stamp does not match upstream source' }
          $resourceStamp = Get-Content apps/desktop/release/win-unpacked/resources/install-stamp.json -Raw | ConvertFrom-Json
          if ($resourceStamp.commit -ne $env:SOURCE_SHA -or $resourceStamp.branch -ne $env:SOURCE_TAG) {
            throw 'Installer resources do not contain the pinned upstream bootstrap stamp'
          }
          $packaged = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($packaged -ne $env:DESKTOP_VERSION) { throw 'Packaged Desktop version does not match upstream Agent version' }
          $installers = @(Get-ChildItem 'apps/desktop/release/*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer; found $($installers.Count)" }
          $installer = $installers[0]
          if ($installer.Length -lt 1000000) { throw 'Installer is unexpectedly small' }
          $out = Join-Path $env:RUNNER_TEMP 'windows-installer'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item $installer.FullName (Join-Path $out 'Hermes-Desktop-Windows-x64-Setup.exe')
          $hash = (Get-FileHash (Join-Path $out 'Hermes-Desktop-Windows-x64-Setup.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Hermes-Desktop-Windows-x64-Setup.exe" | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          "Upstream tag: $env:SOURCE_TAG`nUpstream commit: $env:SOURCE_SHA`nPackaged Desktop version: $env:DESKTOP_VERSION`nDesktop is precompiled; local Agent is NOT bundled. Choose 'Connect to existing Hermes' on first launch." | Set-Content (Join-Path $out 'SOURCE.txt') -Encoding utf8
          "ASSET_DIR=$out" >> $env:GITHUB_ENV

      - name: Archive candidate (even before public publication)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-${{ needs.discover.outputs.source_tag }}
          path: ${{ env.ASSET_DIR }}/*
          if-no-files-found: error
          retention-days: 30

  draft_release:
    needs: [discover, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer-${{ needs.discover.outputs.source_tag }}
          path: release-assets

      - name: Create draft release for human approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
          SOURCE_TAG: ${{ needs.discover.outputs.source_tag }}
          SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
          DESKTOP_VERSION: ${{ needs.build.outputs.desktop_version }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          # This release tag points to the fork's workflow commit, not the
          # upstream source. SOURCE.txt records the exact compiled commit.
          gh release create "$RELEASE_TAG" \
            Hermes-Desktop-Windows-x64-Setup.exe SHA256SUMS.txt SOURCE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Unofficial Hermes Desktop v$DESKTOP_VERSION Windows x64 ($SOURCE_TAG)" \
            --notes "Precompiled NSIS installer from NousResearch/hermes-agent@$SOURCE_SHA. Desktop package version aligned to the Agent project version ($DESKTOP_VERSION) at this commit; it does not assert the connected remote backend has the same version. Choose 'Connect to existing Hermes' to use a remote gateway without installing a local Agent. Local mode remains available and may download dependencies. Unsigned community build; not an official Nous Research release. Validate on a Windows 10/11 workstation before publishing this draft." \
            --draft
